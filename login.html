<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CAPACITY CONNECT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <main class="center">
    <div class="glass auth wide">
      <div class="logo">CAPACITY<span>CONNECT</span></div>
      <h2>Sign in</h2>
      <form id="loginForm" onsubmit="return submitLogin(event);">
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit" class="btn">Login</button>
      </form>
      <div class="divider">OR</div>
      <button class="google" onclick="continueWithGoogle()">Continue with Google</button>
      <p class="muted">New here? <a href="index.html" onclick="localStorage.setItem('openRegister','1')">Create a free account</a></p>
      <div class="notice">Demo login: student@capacityconnect.com / student123</div>
      <p id="loginMsg" class="error"></p>
    </div>
  </main>

  <footer>© 2026 CAPACITY CONNECT<br><span class="project-attribution">Project done by 24H41A4502, 24H41A4529, 24H41A4566, 25H45A4506, 24H41A4519, 24H41A4508</span></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js?v=20260919-2"></script>
</body>
</html>
